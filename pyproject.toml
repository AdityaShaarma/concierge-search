[project]
name = "concierge-search"
version = "0.1.0"
description = "Natural-language place search: LLM query understanding, hybrid retrieval, a fine-tuned cross-encoder reranker, and a LambdaMART final ranker."
readme = "README.md"
# Pinned below 3.13: faiss-cpu and some torch builds lag on new minors.
# uv will fetch 3.12 itself, so this does not depend on the system Python.
requires-python = ">=3.11,<3.13"

dependencies = [
    # ── data
    "duckdb>=1.1",
    "polars>=1.17",
    "pyarrow>=18.0",
    # ── config + validation
    "pydantic>=2.10",
    "pyyaml>=6.0",
    # ── retrieval
    "bm25s>=0.2",
    # Snowball stemming for BM25. Optional to bm25s, but without it the index
    # holds unstemmed tokens and a query for "cafe" misses a document saying
    # "Cafes" - a silent lexical-recall loss, measured in DECISIONS.md D223.
    "PyStemmer>=2.2",
    "faiss-cpu>=1.9",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    # ── learning to rank
    "lightgbm>=4.5",
    "scikit-learn>=1.6",
    "numpy>=2.0",
    "scipy>=1.14",
    # ── LLM clients (Stage 1 + synthetic data)
    "httpx>=0.28",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    # ── serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # ── CLI
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
# Kept separate: ONNX export is a Phase 5 concern and the deps are chunky.
onnx = ["onnx>=1.17", "onnxruntime>=1.20", "optimum>=1.23"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[project.scripts]
concierge-label = "eval.label_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["concierge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by the formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "needs_data: requires the Yelp Open Dataset in data/raw (skipped without it)",
    "needs_api: requires a live LLM API key (skipped without it)",
    "slow: slow test, excluded from the default run",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
