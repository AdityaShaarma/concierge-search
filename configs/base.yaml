# Single source of truth for every tunable. Artifacts are versioned by this file's
# hash so a result can always be traced back to the config that produced it.

seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  # Chosen by the owner after `make explore` (Phase 1 step 2 checkpoint).
  # null means "not yet decided" — the data build refuses to run until it is set,
  # so we never silently index the wrong scope.
  metro: null
  # Permanently closed businesses are excluded from the searchable index.
  drop_closed: true

documents:
  # Business document = name + categories + attribute phrases + sampled tips/reviews.
  # The cap exists because the cross-encoder has a fixed context window; see DECISIONS.md.
  max_chars: 1800
  max_reviews: 4
  max_tips: 3
  # Reviews are sampled by usefulness then recency, not at random — documented decision.
  review_selection: useful_then_recent

query_parsing:
  provider: gemini           # gemini | groq | rules
  model: gemini-2.0-flash
  timeout_s: 4.0
  max_retries: 2
  cache_path: .llm_cache/query_parse.sqlite
  # If the API fails or rate-limits, fall back to the rule-based parser rather
  # than failing the search. Measured separately in the ablation.
  fallback_to_rules: true

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
  dense:
    model: BAAI/bge-small-en-v1.5
    # bge models expect this prefix on queries only, not on passages.
    query_prefix: "Represent this sentence for searching relevant passages: "
    normalize: true
    batch_size: 64
  faiss:
    # Exact search first for correctness. Switch to HNSW only if latency demands
    # it, and only after measuring the recall cost.
    index_type: IndexFlatIP
  fusion:
    method: rrf
    k: 60
  # How to treat a business whose attribute data is missing for a requested
  # constraint. One of: exclude | penalize | neutral. The effect of this choice
  # is measured and reported — attribute coverage in Yelp is sparse.
  missing_attribute_policy: penalize
  missing_attribute_penalty: 0.5

candidates:
  retrieve: 200   # Stage 2 output
  rerank: 50      # Stage 3 output
  final: 10       # Stage 4 output
  # Swept in the quality-vs-latency curve.
  sweep_retrieve: [50, 100, 200, 400]
  sweep_rerank: [10, 25, 50, 100]

# Every knob in the two blocks below is a conventional starting point taken from
# the library's or the base model's own defaults, and NONE has been tuned on this
# project's data — there is no training data to tune against until `make synth`
# runs. DECISIONS.md D233 states where each value comes from, one row per knob,
# and what would settle it. Read it before defending any of them: "it is the
# library default and I have not swept it" is a fine answer, and inventing a
# better-sounding one is not.
rerank:
  base_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # The model's own maximum position count, so a ceiling rather than a choice.
  # Note which cap actually binds: `documents.max_chars` above is the smaller of
  # the two on this tokenizer, so raising it is the experiment, not raising this.
  # `make index` prints the measurement (build_index.report_truncation).
  max_length: 512
  epochs: 2
  batch_size: 16
  lr: 2.0e-5
  warmup_ratio: 0.1
  # No `sweep_models` key here on purpose. CLAUDE.md §3 asks for a
  # quality-vs-latency curve across reranker *sizes* as well as candidate counts,
  # and only the candidate-count axis is built (`candidates.sweep_*`). A list
  # nothing reads would look like the axis exists; the deferral is recorded
  # instead, with what it would cost to add.

ltr:
  objective: lambdarank
  num_leaves: 31
  learning_rate: 0.05
  # An upper bound rather than a target: `early_stopping_rounds` on ltr_val
  # NDCG@10 picks the real number of trees, so this value is measured, not set.
  n_estimators: 400
  early_stopping_rounds: 50
  # The cross-encoder feature MUST come from queries the cross-encoder never saw,
  # or LambdaMART learns to over-trust an inflated signal. Enforced in code.
  enforce_oof_crossencoder_feature: true

synth:
  # One query per query_type. There are exactly four types (CLAUDE.md §6: vibe,
  # constraint, specific, messy) and the prompt says "one query per type, in this
  # order", so this number is not free — it is the size of the type vocabulary,
  # and changing it without changing the prompt would silently ask for an uneven
  # type mix. Enforced nowhere: a mismatch would show up as a skewed
  # per-query-type breakdown, which is a slow way to find out.
  queries_per_business: 4
  # 1200 x 4 = 4800 queries before dedup against gold, which is CLAUDE.md §7's
  # "a few thousand". Also sets the API bill: at batch_size 8 that is 150
  # batches, so at most 150 calls — `make synth` prints the count (cached
  # batches excluded) and asks the owner to confirm before spending quota
  # (CLAUDE.md §10). Untuned — nobody knows yet how many synthetic queries the
  # cross-encoder needs, and the learning curve (train on 25/50/100% of the
  # split and compare NDCG@10 on the validation split) is the measurement that
  # would say.
  businesses_sampled: 1200
  batch_size: 8               # businesses per LLM call, so fewer calls per quota window
  hard_negatives_per_query: 8
  # An LLM judge removes "negatives" that are actually relevant before training.
  false_negative_filter: true
  # Synthetic queries are deduplicated against the gold set, exactly and by
  # embedding similarity above this threshold. Leakage guard.
  gold_dedup_cosine_threshold: 0.92
  # The weakest split grouping a manifest may use and still be trained on.
  # `cluster` keeps near-duplicate queries on one side of the
  # cross-encoder/LambdaMART boundary; `business` and `query` are weaker and are
  # refused unless this is lowered on purpose. Without this, the only thing
  # enforcing the grouping was an argparse default.
  min_split_grouping: cluster
  # Four disjoint splits, not two, because the cross-encoder score is a
  # LambdaMART feature: LambdaMART has to be trained on queries the
  # cross-encoder never saw, or the feature is inflated and the model learns to
  # over-trust it (CLAUDE.md §4, enforced by ltr.enforce_oof_crossencoder_feature).
  #
  # Why the 45/35 asymmetry rather than an even 40/40. The cross-encoder fits
  # 22.7M transformer parameters from raw (query, document) text; LambdaMART fits
  # at most 400 trees of 31 leaves over 11 numeric features. The first is a far
  # harder function to learn from examples, so it gets the larger share.
  # That is a sample-complexity argument, not a measured result — neither split
  # size has been swept, and the learning curve on the validation splits is what
  # would settle it.
  #
  # Why 10% validation each: enough to pick the number of epochs and LightGBM's
  # early-stopping iteration, which is all either validation split is for. They
  # are *not* for tuning against the gold set, which is test-only (CLAUDE.md §6).
  # Must sum to 1.0 — `SynthSplits` refuses otherwise.
  splits:
    crossencoder_train: 0.45
    crossencoder_val: 0.10
    ltr_train: 0.35
    ltr_val: 0.10

evaluation:
  primary_metric: ndcg@10
  cutoffs: [5, 10]
  recall_cutoff: 100
  pool_depth: 20
  bootstrap_samples: 2000
  confidence: 0.95
  # Label a random subset of the gold set first, expand later. Random (fixed
  # seed) so the labeled subset is an unbiased sample of the whole set.
  label_subset_size: 50
  gold_queries: eval/gold_queries.csv
  qrels: eval/qrels.csv
  out_dir: artifacts/eval

serving:
  host: 0.0.0.0
  port: 8000
  use_onnx: false   # flipped on in Phase 5 after a score-parity check
