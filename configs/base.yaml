# Single source of truth for every tunable. Artifacts are versioned by this file's
# hash so a result can always be traced back to the config that produced it.

seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  # Chosen by the owner after `make explore` (Phase 1 step 2 checkpoint).
  # null means "not yet decided" — the data build refuses to run until it is set,
  # so we never silently index the wrong scope.
  metro: null
  # Permanently closed businesses are excluded from the searchable index.
  drop_closed: true

documents:
  # Business document = name + categories + attribute phrases + sampled tips/reviews.
  # The cap exists because the cross-encoder has a fixed context window; see DECISIONS.md.
  max_chars: 1800
  max_reviews: 4
  max_tips: 3
  # Reviews are sampled by usefulness then recency, not at random — documented decision.
  review_selection: useful_then_recent

query_parsing:
  provider: gemini           # gemini | groq | rules
  model: gemini-2.0-flash
  timeout_s: 4.0
  max_retries: 2
  cache_path: .llm_cache/query_parse.sqlite
  # If the API fails or rate-limits, fall back to the rule-based parser rather
  # than failing the search. Measured separately in the ablation.
  fallback_to_rules: true

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
  dense:
    model: BAAI/bge-small-en-v1.5
    # bge models expect this prefix on queries only, not on passages.
    query_prefix: "Represent this sentence for searching relevant passages: "
    normalize: true
    batch_size: 64
  faiss:
    # Exact search first for correctness. Switch to HNSW only if latency demands
    # it, and only after measuring the recall cost.
    index_type: IndexFlatIP
  fusion:
    method: rrf
    k: 60
  # How to treat a business whose attribute data is missing for a requested
  # constraint. One of: exclude | penalize | neutral. The effect of this choice
  # is measured and reported — attribute coverage in Yelp is sparse.
  missing_attribute_policy: penalize
  missing_attribute_penalty: 0.5

candidates:
  retrieve: 200   # Stage 2 output
  rerank: 50      # Stage 3 output
  final: 10       # Stage 4 output
  # Swept in the quality-vs-latency curve.
  sweep_retrieve: [50, 100, 200, 400]
  sweep_rerank: [10, 25, 50, 100]

rerank:
  base_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  max_length: 512
  epochs: 2
  batch_size: 16
  lr: 2.0e-5
  warmup_ratio: 0.1

ltr:
  objective: lambdarank
  num_leaves: 31
  learning_rate: 0.05
  n_estimators: 400
  early_stopping_rounds: 50
  # The cross-encoder feature MUST come from queries the cross-encoder never saw,
  # or LambdaMART learns to over-trust an inflated signal. Enforced in code.
  enforce_oof_crossencoder_feature: true

synth:
  queries_per_business: 4
  businesses_sampled: 1200
  batch_size: 8               # businesses per LLM call, to respect free-tier limits
  hard_negatives_per_query: 8
  # An LLM judge removes "negatives" that are actually relevant before training.
  false_negative_filter: true
  # Synthetic queries are deduplicated against the gold set, exactly and by
  # embedding similarity above this threshold. Leakage guard.
  gold_dedup_cosine_threshold: 0.92
  # The weakest split grouping a manifest may use and still be trained on.
  # `cluster` keeps near-duplicate queries on one side of the
  # cross-encoder/LambdaMART boundary; `business` and `query` are weaker and are
  # refused unless this is lowered on purpose. Without this, the only thing
  # enforcing the grouping was an argparse default.
  min_split_grouping: cluster
  splits:
    crossencoder_train: 0.45
    crossencoder_val: 0.10
    ltr_train: 0.35
    ltr_val: 0.10

evaluation:
  primary_metric: ndcg@10
  cutoffs: [5, 10]
  recall_cutoff: 100
  pool_depth: 20
  bootstrap_samples: 2000
  confidence: 0.95
  # Label a random subset of the gold set first, expand later. Random (fixed
  # seed) so the labeled subset is an unbiased sample of the whole set.
  label_subset_size: 50
  gold_queries: eval/gold_queries.csv
  qrels: eval/qrels.csv
  out_dir: artifacts/eval

serving:
  host: 0.0.0.0
  port: 8000
  use_onnx: false   # flipped on in Phase 5 after a score-parity check
